<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>右手螺旋定则 · 3D 手势实验</title>
  <style>
    *{box-sizing:border-box}body{margin:0;overflow:hidden;background:radial-gradient(circle at 50% 35%,#244b79,#071323 72%);color:#e8f2ff;font:16px/1.5 system-ui,"Microsoft YaHei",sans-serif}#stage{position:relative;width:100vw;height:100vh}canvas,#camera{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}#camera{opacity:0;transform:scaleX(-1);transition:opacity .35s}.camera-on #camera{opacity:.25}.hud{position:absolute;z-index:2;background:#09192edb;border:1px solid #456789;border-radius:14px;backdrop-filter:blur(12px)}.title{top:18px;left:18px;padding:13px 17px;max-width:360px}.title b{display:block;font-size:19px}.title small{color:#94b8db}.status{right:18px;top:18px;padding:10px 14px;max-width:315px;color:#bcecff;font-size:14px}.toolbar{position:absolute;z-index:2;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:min(94vw,760px)}button{border:1px solid #4c749a;background:#143654;color:#e9f5ff;border-radius:11px;padding:10px 14px;font:inherit;cursor:pointer}button:hover{background:#215477}button.primary{border-color:#55cfea;background:#137aa3}.legend{position:absolute;z-index:2;bottom:20px;right:18px;padding:10px 14px;font-size:13px;color:#b6d1ea}.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin:0 5px 0 12px}.north{background:#ef4f65}.south{background:#347eea}.hint{position:absolute;z-index:2;left:18px;bottom:20px;padding:10px 14px;font-size:13px;color:#c9dbed;max-width:360px}@media(max-width:650px){.status{top:auto;bottom:104px;right:12px;left:12px;max-width:none}.title{top:12px;left:12px}.legend{display:none}.hint{display:none}.toolbar{bottom:12px}button{padding:9px 10px;font-size:14px}}
  </style>
</head>
<body>
  <style>
    .loader{position:absolute;z-index:4;left:50%;top:50%;width:min(420px,78vw);transform:translate(-50%,-50%);padding:22px;border:1px solid #5b87af;border-radius:18px;background:#08182bdf;backdrop-filter:blur(14px);box-shadow:0 18px 60px #0009;transition:opacity .5s,transform .5s}.loader.done{opacity:0;transform:translate(-50%,-44%);pointer-events:none}.loader b{display:flex;justify-content:space-between;font-size:15px}.loader small{display:block;margin-top:8px;color:#a8c7e5}.track{height:10px;margin-top:14px;overflow:hidden;border-radius:999px;background:#1e3652}.bar{width:2%;height:100%;border-radius:inherit;background:linear-gradient(90deg,#2b8cff,#5de0ce);box-shadow:0 0 16px #5de0ce;transition:width .2s ease}
  </style>
  <main id="stage">
    <video id="camera" autoplay muted playsinline></video>
    <div class="hud title"><b>右手螺旋定则 · 3D 实验</b><small>真实 Blender 模型 · 拖动旋转 · 滚轮缩放</small></div>
    <div class="hud status" id="status">正在连接 Blender 三维模型…</div>
    <div class="loader" id="loader" role="status"><b><span>正在加载 3D 模型</span><span id="percent">0%</span></b><div class="track"><div class="bar" id="bar"></div></div><small id="loadDetail">准备下载模型文件…</small></div>
    <div class="hud hint">屏幕模式：拖动旋转，滚轮/双指缩放。<br>手势模式：食指上下切换磁场方向，捏合缩放，左右移动旋转。</div>
    <div class="toolbar"><button id="left">↺ 左旋</button><button id="right">↻ 右旋</button><button id="reverse">⇄ 切换电流</button><button id="cameraButton" class="primary">✋ 启动右手手势</button><button id="reset">◎ 复位</button></div>
    <div class="hud legend"><i class="south"></i>S 极　<i class="north"></i>N 极　青色箭头：内部磁场</div>
  </main>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.181.0/build/three.module.js"}}
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.181.0/examples/jsm/loaders/GLTFLoader.js';
    const stage=document.querySelector('#stage'), status=document.querySelector('#status'), video=document.querySelector('#camera'), loaderBox=document.querySelector('#loader'), bar=document.querySelector('#bar'), percent=document.querySelector('#percent'), loadDetail=document.querySelector('#loadDetail');
    const scene=new THREE.Scene(), camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(0,1.2,10);
    const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;stage.prepend(renderer.domElement);
    scene.add(new THREE.HemisphereLight(0xb7dcff,0x071323,2.2));const key=new THREE.DirectionalLight(0xffffff,3);key.position.set(4,6,7);scene.add(key);const rim=new THREE.DirectionalLight(0xff7a35,2);rim.position.set(-5,2,-4);scene.add(rim);
    let model, direction=1, targetRotation=0, scale=1, dragging=false, previousX=0, handLandmarker, handActive=false, stream, lastPalm;
    const loader=new GLTFLoader();loader.load('assets/solenoid-hand-control.glb',gltf=>{model=gltf.scene;model.rotation.set(-.16,-.35,0);scene.add(model);bar.style.width='100%';percent.textContent='100%';loadDetail.textContent='模型已就绪，正在启动交互实验…';status.textContent='模型已就绪：拖动旋转、滚轮缩放，或启动右手手势。';setTimeout(()=>loaderBox.classList.add('done'),800)},event=>{const loaded=event.loaded||0,total=event.total||0;if(total){const value=Math.min(99,Math.round(loaded/total*100));bar.style.width=value+'%';percent.textContent=value+'%';loadDetail.textContent=`已下载 ${(loaded/1024/1024).toFixed(2)} / ${(total/1024/1024).toFixed(2)} MB`;}else{bar.style.width='55%';percent.textContent='加载中';loadDetail.textContent=`已下载 ${(loaded/1024/1024).toFixed(2)} MB，正在读取模型…`;}},()=>{loaderBox.classList.remove('done');bar.style.background='#ef5b6c';loadDetail.textContent='模型加载失败，请刷新页面后重试。';status.textContent='模型加载失败，请检查网络或刷新页面。'});
    function apply(){if(!model)return;model.rotation.y+=(targetRotation-model.rotation.y)*.12;model.scale.setScalar(scale);}
    function reverse(){direction*=-1;if(!model)return;const arrows=model.children.filter(o=>o.name.includes('Magnetic field'));arrows.forEach(o=>o.rotation.x=direction===1?0:Math.PI);status.textContent=`电流方向已切换：右手拇指所指的内部磁场现在${direction===1?'由 S 指向 N（向右）':'由 N 指向 S（向左）'}。`;}
    document.querySelector('#left').onclick=()=>targetRotation-=.35;document.querySelector('#right').onclick=()=>targetRotation+=.35;document.querySelector('#reverse').onclick=reverse;document.querySelector('#reset').onclick=()=>{targetRotation=-.35;scale=1;direction=1;status.textContent='已复位到默认视角。'};
    stage.addEventListener('pointerdown',e=>{dragging=true;previousX=e.clientX;stage.setPointerCapture(e.pointerId)});stage.addEventListener('pointermove',e=>{if(dragging){targetRotation+=(e.clientX-previousX)*.012;previousX=e.clientX}});stage.addEventListener('pointerup',()=>dragging=false);stage.addEventListener('wheel',e=>{e.preventDefault();scale=THREE.MathUtils.clamp(scale-e.deltaY*.001,.55,1.65)},{passive:false});
    async function startHands(){if(!navigator.mediaDevices?.getUserMedia){status.textContent='当前浏览器不支持摄像头接口。请使用屏幕模式。';return}try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});video.srcObject=stream;stage.classList.add('camera-on');status.textContent='正在加载右手识别模型…';const vision=await import('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22');const files=await vision.FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');handLandmarker=await vision.HandLandmarker.createFromOptions(files,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numHands:1});handActive=true;document.querySelector('#cameraButton').textContent='■ 关闭手势';document.querySelector('#cameraButton').onclick=stopHands;trackHands();status.textContent='右手识别已启动，请将右手置于画面内。'}catch{status.textContent='无法启动摄像头或识别模型。请允许摄像头权限；屏幕模式仍可使用。'}}
    function stopHands(){handActive=false;lastPalm=null;handLandmarker?.close?.();handLandmarker=null;stream?.getTracks().forEach(t=>t.stop());stream=null;video.srcObject=null;stage.classList.remove('camera-on');document.querySelector('#cameraButton').textContent='✋ 启动右手手势';document.querySelector('#cameraButton').onclick=startHands;status.textContent='已回到屏幕控制模式。'}
    function trackHands(){if(!handActive)return;if(video.readyState>=2){const hands=handLandmarker.detectForVideo(video,performance.now()).landmarks?.[0];if(hands){const index=hands[8],pip=hands[6],thumb=hands[4],palm=hands[0],pinch=Math.hypot(index.x-thumb.x,index.y-thumb.y);const wanted=index.y<pip.y-.05?1:-1;if(wanted!==direction)reverse();scale=THREE.MathUtils.clamp(1.55-pinch*2.2,.55,1.65);if(lastPalm!==undefined)targetRotation+=(palm.x-lastPalm)*5;lastPalm=palm.x;status.textContent=`右手已识别 · ${direction===1?'磁场向右':'磁场向左'} · ${pinch<.08?'捏合放大':'张开缩放'}`;}else{lastPalm=undefined;status.textContent='请把右手放到摄像头画面内。'}}requestAnimationFrame(trackHands)}
    document.querySelector('#cameraButton').onclick=startHands;addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});(function render(){apply();renderer.render(scene,camera);requestAnimationFrame(render)})();
  </script>
</body>
</html>
