<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>心脏律动 AR</title>
<style>
:root{--c:#69e9ff;--r:#ff5971;--ink:#eefaff;--dim:#a7c2d6}*{box-sizing:border-box}body{margin:0;background:#030b16;color:var(--ink);font-family:"Microsoft YaHei",system-ui,sans-serif}.app{min-height:100vh;background:radial-gradient(ellipse at 50% 25%,#16436d,#061629 50%,#020914)}.top{height:74px;padding:0 5vw;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #5bb8df55;background:#061320df;backdrop-filter:blur(12px);position:relative;z-index:4}.brand{display:flex;gap:12px;align-items:center}.icon{width:36px;height:36px;display:grid;place-items:center;border:1px solid var(--c);border-radius:50%;background:#175984;box-shadow:0 0 20px #52dcff77}.eyebrow{margin:0;color:var(--c);font-size:12px;font-weight:800;letter-spacing:.12em}.brand h1{margin:2px 0 0;font-size:20px}.state{font-size:14px;color:#bdd9e9}.state i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#687b8d;margin-right:8px}.state.ready i{background:#6df0af;box-shadow:0 0 12px #6df0af}.stage{position:relative;min-height:calc(100vh - 74px);overflow:hidden;isolation:isolate;display:grid;place-items:center}.stage:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#061526dd,#06152622 34%,#06152622 66%,#061526dd);z-index:0}.camera{display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);z-index:-2;filter:contrast(1.1) saturate(.8)}.stage.camera-on .camera{display:block}.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,transparent 0 4px,#9eeeff0b 5px 6px);z-index:1}.grid{position:absolute;inset:8%;border:1px solid #78e3ff2a;background:linear-gradient(90deg,transparent 49.8%,#79dfff25 50%,transparent 50.2%),linear-gradient(0deg,transparent 49.8%,#79dfff25 50%,transparent 50.2%);background-size:20% 100%,100% 20%;clip-path:polygon(5% 0,95% 0,100% 100%,0 100%);z-index:1}.heart-wrap{position:absolute;z-index:2;left:50%;top:48%;width:min(42vw,520px);aspect-ratio:1;transform:translate(-50%,-50%);touch-action:none}.heart-wrap:after{content:"";position:absolute;inset:17%;border-radius:50%;background:#f942593d;filter:blur(36px);z-index:-1}.heart{width:100%;height:100%;object-fit:contain;user-select:none;-webkit-user-drag:none;--scale:1;--beat:1s;transform:scale(var(--scale));filter:drop-shadow(0 0 25px #ff647aaa);animation:beat var(--beat) cubic-bezier(.25,.05,.5,1) infinite;will-change:transform}@keyframes beat{0%,100%{transform:scale(var(--scale))}10%{transform:scale(calc(var(--scale)*1.1))}20%{transform:scale(calc(var(--scale)*.98))}31%{transform:scale(calc(var(--scale)*1.06))}42%{transform:scale(var(--scale))}}.dragging .heart{animation-play-state:paused}.canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}.hud{position:absolute;z-index:4;left:5vw;top:9vh;width:min(335px,42vw)}.badge{display:inline-block;padding:7px 11px;border:1px solid #70e5ff77;border-radius:99px;background:#0a2442c9;color:var(--c);font-size:12px;font-weight:800}.hud h2{font-size:clamp(29px,3.1vw,46px);line-height:1.08;letter-spacing:.04em;margin:15px 0 10px}.hud p{margin:0;color:#c8ddeb;line-height:1.7;font-size:15px}.gestures{margin-top:19px;display:grid;gap:8px}.gesture{display:flex;gap:10px;align-items:center;padding:10px 12px;border:1px solid #5f98bc66;border-radius:11px;background:#071d37ce;font-size:14px}.gesture span{font-size:20px}.panel{position:absolute;z-index:4;right:5vw;top:9vh;width:220px;padding:15px;border:1px solid #6de8ff55;border-radius:16px;background:#071a31c9;backdrop-filter:blur(8px)}.panel h3{color:#8ceaff;font-size:12px;letter-spacing:.12em;margin:0 0 10px}.metric{display:flex;justify-content:space-between;padding:9px 0;border-top:1px solid #71dfff20;color:#c5ddec;font-size:13px}.metric b{color:white}.controls{position:absolute;z-index:4;bottom:27px;left:50%;transform:translateX(-50%);display:flex;justify-content:center;align-items:center;gap:9px;flex-wrap:wrap;width:min(92%,850px)}button,input{font:inherit}.btn{border:1px solid #6ce5ff88;border-radius:10px;padding:11px 15px;background:#092542dd;color:#e9faff;cursor:pointer;transition:.18s}.btn:hover{transform:translateY(-2px);border-color:#a3f2ff}.btn.primary{background:#e94b63;border-color:#ffa0ad;font-weight:800;color:white}.range{display:flex;align-items:center;gap:8px;padding:9px 12px;background:#071b32de;border:1px solid #5d8fac77;border-radius:10px;color:#c7ddec;font-size:13px}.range input{accent-color:#ff5971;width:105px}.notice{display:none;position:absolute;z-index:5;right:5vw;bottom:34px;width:min(370px,88vw);padding:13px 15px;border-left:3px solid var(--c);border-radius:0 9px 9px 0;background:#192f55ea;color:#e8f8ff;font-size:14px;line-height:1.55}.notice.show{display:block}@media(max-width:800px){.top{height:63px;padding:0 18px}.brand h1{font-size:16px}.stage{min-height:calc(100vh - 63px)}.hud{top:26px;left:20px;width:calc(100% - 40px)}.hud h2{font-size:29px;margin:10px 0 5px}.hud p{font-size:13px;max-width:330px}.gestures{display:none}.panel{top:auto;bottom:142px;right:16px;width:158px;padding:10px}.metric{padding:5px 0}.heart-wrap{width:min(78vw,420px);top:50%}.controls{bottom:16px}.range{padding:8px}.range input{width:70px}.notice{bottom:150px;right:16px}.state{font-size:12px}}
</style></head><body><main class="app"><header class="top"><div class="brand"><span class="icon">♥</span><div><p class="eyebrow">七年级生物 · 摄像头手势互动</p><h1>心脏律动 AR</h1></div></div><div class="state" id="state"><i></i><span>等待启动摄像头</span></div></header>
<section class="stage" id="stage"><video class="camera" id="camera" autoplay muted playsinline></video><canvas class="canvas" id="canvas"></canvas><div class="scan"></div><div class="grid"></div><div class="hud"><span class="badge">● LIVE BIOLOGY LAB</span><h2>把心脏<br>放进真实空间</h2><p>启动摄像头后，系统追踪一只手。你的手掌将控制心脏的位置、大小与跳动强度。</p><div class="gestures"><div class="gesture"><span>🖐</span><div><b>张开手掌</b><br>移动并放大心脏</div></div><div class="gesture"><span>🤏</span><div><b>拇指与食指捏合</b><br>增强心脏跳动</div></div></div></div>
<aside class="panel"><h3>实时观察</h3><div class="metric"><span>手势状态</span><b id="gstate">未识别</b></div><div class="metric"><span>跳动强度</span><b id="bstate">标准</b></div><div class="metric"><span>当前频率</span><b id="bpm">72 BPM</b></div></aside>
<div class="heart-wrap" id="wrap"><img class="heart" id="heart" src="assets/anatomical-heart-ar.png" alt="医学解剖风格的拟真心脏"></div><div class="notice" id="notice"></div>
<div class="controls"><button class="btn primary" id="start">📷 启动 AR 手势控制</button><button class="btn" id="demo">♥ 演示强跳</button><span class="range" id="manual">拖动调节 <input id="range" type="range" min="0" max="100" value="30"></span><button class="btn" id="reset">↺ 居中</button></div></section></main>
<script type="module">
import{FilesetResolver,HandLandmarker}from'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22';
const $=id=>document.getElementById(id),stage=$('stage'),video=$('camera'),canvas=$('canvas'),ctx=canvas.getContext('2d'),wrap=$('wrap'),heart=$('heart'),start=$('start'),notice=$('notice');let lm,stream,last=-1,active=false,pos={x:50,y:48,s:1},drag;const links=[[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[0,9],[9,10],[10,11],[11,12],[0,13],[13,14],[14,15],[15,16],[0,17],[17,18],[18,19],[19,20],[5,9],[9,13],[13,17]],dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),clip=(n,a,b)=>Math.max(a,Math.min(b,n));
function tell(s){notice.textContent=s;notice.classList.add('show');setTimeout(()=>notice.classList.remove('show'),4200)}function apply(){wrap.style.left=pos.x+'%';wrap.style.top=pos.y+'%';heart.style.setProperty('--scale',pos.s)}function beat(n=.3){const bpm=Math.round(68+n*72);heart.style.setProperty('--beat',clip(60/bpm,.42,1.05)+'s');$('bstate').textContent=n>.7?'强跳动':n>.35?'增强':'标准';$('bpm').textContent=bpm+' BPM'}function draw(p){canvas.width=stage.clientWidth;canvas.height=stage.clientHeight;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.strokeStyle='#74ebff';ctx.fillStyle='#e0fcff';ctx.lineWidth=3;ctx.shadowColor='#31dfff';ctx.shadowBlur=10;links.forEach(([a,b])=>{ctx.beginPath();ctx.moveTo((1-p[a].x)*canvas.width,p[a].y*canvas.height);ctx.lineTo((1-p[b].x)*canvas.width,p[b].y*canvas.height);ctx.stroke()});p.forEach((v,i)=>{ctx.beginPath();ctx.arc((1-v.x)*canvas.width,v.y*canvas.height,i===4||i===8?7:4,0,7);ctx.fill()});ctx.shadowBlur=0}
async function loop(){if(!lm||video.readyState<2){requestAnimationFrame(loop);return}if(video.currentTime!==last){last=video.currentTime;let r=lm.detectForVideo(video,performance.now());ctx.clearRect(0,0,canvas.width,canvas.height);if(r.landmarks?.length){let p=r.landmarks[0],palm=Math.max(dist(p[5],p[17]),.08),pinch=dist(p[4],p[8])/palm,open=dist(p[8],p[20])/palm;pos.x=clip((1-p[0].x)*100,18,82);pos.y=clip(p[0].y*100,22,74);pos.s=clip(.67+palm*3.2,.85,1.62);apply();beat(clip((1.25-pinch)/1.25,.1,1));$('gstate').textContent=pinch<.42?'捏合中':open>1.35?'张开手掌':'正在追踪';draw(p)}else $('gstate').textContent='请把一只手放入画面'}requestAnimationFrame(loop)}
async function enable(){start.disabled=true;start.textContent='正在加载手势识别…';try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:1280},height:{ideal:720}},audio:false});video.srcObject=stream;await video.play();let vision=await FilesetResolver.forVisionTasks('https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm');lm=await HandLandmarker.createFromOptions(vision,{baseOptions:{modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/latest/hand_landmarker.task',delegate:'GPU'},runningMode:'VIDEO',numHands:1});active=true;stage.classList.add('camera-on');$('state').classList.add('ready');$('state').querySelector('span').textContent='AR 手势识别已启动';start.textContent='AR 手势控制运行中';$('manual').style.display='none';tell('将一只手置于镜头前：张开手掌移动心脏；捏合拇指与食指增强跳动。');loop()}catch(e){start.disabled=false;start.textContent='📷 再试一次启动 AR';tell('无法启动摄像头或手势模型。请允许摄像头权限，并确认网络可加载识别模型。')}}
start.onclick=enable;$('demo').onclick=()=>{beat(1);heart.animate([{filter:'brightness(1)'},{filter:'brightness(1.45) drop-shadow(0 0 40px #ff6377)'},{filter:'brightness(1)'}],{duration:650,iterations:2})};$('range').oninput=e=>beat(e.target.value/100);$('reset').onclick=()=>{pos={x:50,y:48,s:1};apply();beat(.3)};wrap.onpointerdown=e=>{if(active)return;drag={x:e.clientX,y:e.clientY,px:pos.x,py:pos.y};wrap.classList.add('dragging');wrap.setPointerCapture(e.pointerId)};wrap.onpointermove=e=>{if(!drag)return;pos.x=clip(drag.px+(e.clientX-drag.x)/stage.clientWidth*100,14,86);pos.y=clip(drag.py+(e.clientY-drag.y)/stage.clientHeight*100,18,82);apply()};wrap.onpointerup=()=>{drag=null;wrap.classList.remove('dragging')};apply();beat();
</script></body></html>
