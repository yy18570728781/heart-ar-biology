<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>生命泵站｜心脏与血液循环</title>
  <style>
    :root{--ink:#eaf4ff;--muted:#9db4cc;--panel:#102744;--panel2:#0b1d35;--line:#294b70;--red:#ff6677;--blue:#59b8ff;--gold:#f8d475;--shadow:0 18px 48px #030b17aa}*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:"Microsoft YaHei",system-ui,sans-serif;background:radial-gradient(circle at 48% -10%,#1f5d8f 0,#0b203b 38%,#061323 80%);letter-spacing:.01em}button,select{font:inherit}button{cursor:pointer}.shell{max-width:1540px;margin:auto;padding:26px 34px 34px}.top{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:22px}.brand{display:flex;gap:14px;align-items:center}.mark{width:44px;height:44px;display:grid;place-items:center;border:1px solid #66d7ff;border-radius:14px;background:#1b5784;color:#fff;font-size:25px;box-shadow:0 0 26px #52c9ff55}.eyebrow{margin:0 0 3px;color:#81d9ff;font-size:14px;font-weight:700}.brand h1{margin:0;font-size:25px;letter-spacing:.08em}.hint{color:var(--muted);font-size:14px}.modes{display:flex;gap:8px;flex-wrap:wrap}.mode,.tool{border:1px solid #3c6389;background:#122c4c;color:#dceeff;border-radius:10px;padding:9px 14px;transition:.2s}.mode:hover,.tool:hover{border-color:#7bd9ff;transform:translateY(-1px)}.mode.active{background:#38a9dc;border-color:#8ee7ff;color:#031529;font-weight:800}.grid{display:grid;grid-template-columns:230px minmax(560px,1fr) 310px;gap:16px}.card{background:linear-gradient(145deg,#153657e8,#0c213ce8);border:1px solid #2c5076;border-radius:18px;box-shadow:var(--shadow)}.rail{padding:16px}.section-title{font-size:13px;font-weight:800;color:#8fdfff;letter-spacing:.12em;margin:4px 0 12px}.steps{list-style:none;padding:0;margin:0}.steps button{width:100%;text-align:left;background:transparent;border:0;border-left:2px solid #45698d;color:#b8cee5;padding:11px 11px 11px 15px;margin:2px 0;font-size:15px}.steps button.active,.steps button:hover{border-left-color:#61d2ff;color:#fff;background:#1a4368;border-radius:0 9px 9px 0}.steps small{display:block;color:#80a1c1;margin-top:4px;font-size:12px}.fact{padding:13px 14px;margin-top:18px;border-radius:12px;background:#0a1c32;color:#cde1f3;font-size:14px;line-height:1.6}.fact b{color:var(--gold)}.stage{min-height:650px;display:flex;flex-direction:column;overflow:hidden}.stage-head{padding:17px 21px 11px;display:flex;justify-content:space-between;align-items:flex-start;gap:12px}.stage h2{margin:0;font-size:21px}.stage p{margin:6px 0 0;color:var(--muted);font-size:14px}.status{font-size:13px;color:#a9e3ff;border:1px solid #386e94;border-radius:99px;padding:6px 10px;white-space:nowrap}.diagram{flex:1;min-height:450px;padding:5px 18px 2px}.diagram svg{display:block;width:100%;height:100%;min-height:440px}.body{fill:#b9dded11;stroke:#76b5d1;stroke-width:2}.vessel{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:18;filter:drop-shadow(0 0 4px currentColor)}.red{stroke:var(--red);color:var(--red)}.blue{stroke:var(--blue);color:var(--blue)}.inactive{opacity:.12}.organ{cursor:pointer;transition:.2s;outline:none}.organ:hover .halo,.organ:focus .halo{opacity:.8}.halo{opacity:0;fill:#c8efff;filter:blur(7px)}.label{font-size:15px;fill:#dceeff;font-weight:700;paint-order:stroke;stroke:#0b1d35;stroke-width:4px;stroke-linejoin:round}.tiny{font-size:12px;fill:#aac9df}.heart{fill:#e94d6d;stroke:#ffd0d9;stroke-width:2}.lung{fill:#a7d6ef33;stroke:#9edfff;stroke-width:2}.cap{fill:#d7e9fa33;stroke:#cceaff;stroke-width:1}.node-dot{fill:#fff;stroke:#2a6997;stroke-width:3}.controls{padding:13px 18px 17px;border-top:1px solid #294d71;display:flex;align-items:center;gap:9px;flex-wrap:wrap}.tool.primary{background:#e86074;color:white;border-color:#ff9eaa;font-weight:800}.tool[aria-pressed="true"]{border-color:#8bdfff;background:#21587c}.speed{margin-left:auto;display:flex;align-items:center;gap:7px;color:var(--muted);font-size:14px}.speed select{background:#0a1b31;border:1px solid #426b91;color:#dceeff;border-radius:8px;padding:7px}.side{padding:18px}.side h3{margin:0 0 10px;font-size:20px}.side .tag{display:inline-block;border-radius:99px;background:#204e6c;color:#a8e9ff;padding:4px 9px;font-size:12px;font-weight:700}.side p{color:#c6d9eb;line-height:1.7;font-size:15px}.route{margin:16px 0;padding:12px;border-left:3px solid var(--blue);background:#09213b;border-radius:0 10px 10px 0;color:#d7eaff;font-size:14px;line-height:1.65}.route.red-route{border-color:var(--red)}.quiz{margin-top:18px;border-top:1px solid #294b70;padding-top:16px}.quiz h4{margin:0 0 8px;color:#f4d986}.quiz p{font-size:14px;margin:0 0 10px}.answers{display:grid;gap:7px}.answer{border:1px solid #42698d;background:#0c2744;color:#dceeff;text-align:left;padding:9px;border-radius:9px;font-size:14px}.answer:hover{border-color:#8edfff}.feedback{display:none;margin-top:10px;padding:10px;border-radius:9px;font-size:14px;line-height:1.55}.feedback.show{display:block}.feedback.good{background:#125842;color:#dbffef}.feedback.bad{background:#6d3040;color:#ffe1e6}.footnote{margin-top:16px;color:#7e9cba;font-size:12px;line-height:1.5}@media(max-width:1050px){.grid{grid-template-columns:190px 1fr}.side{grid-column:1/-1}.stage{min-height:600px}.quiz{display:grid;grid-template-columns:1.3fr 1fr;gap:12px;align-items:start}.quiz h4,.quiz p{grid-column:1/-1}}@media(max-width:720px){.shell{padding:16px}.top{align-items:flex-start;flex-direction:column}.grid{display:block}.rail,.side{margin-bottom:14px}.stage{min-height:560px}.diagram{padding:0 6px}.stage-head{padding:14px}.hint{display:none}.speed{margin-left:0}.quiz{display:block}.label{font-size:12px}.vessel{stroke-width:13}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="top"><div class="brand"><div class="mark">♥</div><div><p class="eyebrow">七年级生物 · 可互动可视化课件</p><h1>生命泵站｜心脏与血液循环</h1></div></div><div class="modes" aria-label="循环观察模式"><button class="mode active" data-mode="all">总览</button><button class="mode" data-mode="pulmonary">肺循环</button><button class="mode" data-mode="systemic">体循环</button></div></header>
    <section class="grid">
      <aside class="card rail"><div class="section-title">学习路径</div><ol class="steps"><li><button class="active" data-step="all">01 血液循环总览<small>两条循环，同时进行</small></button></li><li><button data-step="heart">02 认识心脏<small>四个心腔，连接两套循环</small></button></li><li><button data-step="pulmonary">03 肺循环<small>去肺部完成气体交换</small></button></li><li><button data-step="systemic">04 体循环<small>向全身运输氧和养料</small></button></li><li><button data-step="challenge">05 互动挑战<small>检查你的判断</small></button></li></ol><div class="fact"><b>观察提示</b><br>先看粒子的方向，再判断它属于肺循环还是体循环。</div></aside>
      <section class="card stage"><div class="stage-head"><div><h2 id="title">血液循环总览</h2><p id="subtitle">点击结构查看知识卡；按播放键追踪血液回到心脏的路径。</p></div><span class="status" id="status">双循环同步</span></div>
        <div class="diagram"><svg viewBox="0 0 760 520" role="img" aria-label="心脏与血液循环的互动示意图">
          <defs><filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>
          <path class="body" d="M301 62 Q280 87 288 130 L250 207 277 260 264 459 Q310 492 380 493 Q450 492 496 459 L483 260 510 207 472 130 Q480 87 459 62 Q380 25 301 62Z"/>
          <g class="organ" tabindex="0" role="button" data-info="lungs"><ellipse class="halo" cx="320" cy="176" rx="55" ry="66"/><ellipse class="halo" cx="440" cy="176" rx="55" ry="66"/><path class="lung" d="M366 130 Q315 104 285 151 Q267 187 300 223 Q333 242 367 211Z"/><path class="lung" d="M394 130 Q445 104 475 151 Q493 187 460 223 Q427 242 393 211Z"/><text class="label" x="260" y="119">肺部</text></g>
          <g class="organ" tabindex="0" role="button" data-info="heart"><circle class="halo" cx="380" cy="240" r="51"/><path class="heart" d="M380 282 C345 252 329 229 336 207 C343 184 371 187 380 205 C389 187 417 184 424 207 C431 229 415 252 380 282Z"/><path d="M374 202 L374 255 M387 202 L387 255" stroke="#ffe1e7" stroke-width="2"/><text class="label" x="403" y="254">心脏</text></g>
          <g class="organ" tabindex="0" role="button" data-info="body"><circle class="halo" cx="380" cy="371" r="70"/><path class="cap" d="M333 332 Q380 307 427 332 L446 383 Q414 427 380 430 Q346 427 314 383Z"/><path class="cap" d="M338 350 Q380 335 422 350 M330 373 Q380 355 430 373 M344 397 Q380 383 416 397" stroke="#d8efff" stroke-width="2" fill="none"/><text class="label" x="459" y="383">全身毛细血管</text></g>
          <path id="pBlue" class="vessel blue" d="M365 232 C335 221 306 220 298 190 C293 170 310 158 334 171 C352 181 359 198 365 207 M365 236 C350 261 336 284 330 330 C322 380 303 408 280 420 M395 236 C412 266 426 293 430 330 C438 380 457 408 480 420"/>
          <path id="pRed" class="vessel red" d="M395 232 C425 221 454 220 462 190 C467 170 450 158 426 171 C408 181 401 198 395 207 M395 236 C410 261 424 284 430 330 C438 380 457 408 480 420 M365 236 C348 266 334 293 330 330 C322 380 303 408 280 420" opacity=".92"/>
          <path id="pSystemicRed" class="vessel red" d="M394 244 C450 265 516 270 552 306 C582 337 561 398 520 423 C477 449 439 449 414 432"/>
          <path id="pSystemicBlue" class="vessel blue" d="M366 244 C310 265 244 270 208 306 C178 337 199 398 240 423 C283 449 321 449 346 432"/>
          <g class="organ" tabindex="0" role="button" data-info="pulmonaryArtery"><circle class="node-dot" cx="334" cy="190" r="7"/><text class="label" x="118" y="177">肺动脉</text><text class="tiny" x="118" y="195">含氧较少</text></g>
          <g class="organ" tabindex="0" role="button" data-info="pulmonaryVein"><circle class="node-dot" cx="426" cy="190" r="7"/><text class="label" x="474" y="177">肺静脉</text><text class="tiny" x="474" y="195">含氧较多</text></g>
          <g class="organ" tabindex="0" role="button" data-info="aorta"><circle class="node-dot" cx="515" cy="286" r="7"/><text class="label" x="535" y="278">主动脉</text><text class="tiny" x="535" y="296">向全身运输</text></g>
          <g class="organ" tabindex="0" role="button" data-info="venaCava"><circle class="node-dot" cx="245" cy="286" r="7"/><text class="label" x="81" y="278">上、下腔静脉</text><text class="tiny" x="81" y="296">回流到右心房</text></g>
          <g class="labels"><text class="label" x="294" y="242">右心室</text><text class="label" x="398" y="242">左心室</text><text class="tiny" x="303" y="260">右心房在其上方</text><text class="tiny" x="398" y="260">左心房在其上方</text></g>
          <g id="particles"></g>
          <text class="tiny" x="298" y="485">示意图：红色表示含氧较多，蓝色表示含氧较少。</text>
        </svg></div>
        <div class="controls"><button class="tool primary" id="play" aria-pressed="true">❚❚ 暂停流动</button><button class="tool" id="reset">↺ 重置</button><button class="tool" id="labels" aria-pressed="true">◉ 标签：开</button><div class="speed">速度 <select id="speed" aria-label="动画速度"><option value="0.55">0.5×</option><option value="1" selected>1×</option><option value="1.7">1.5×</option></select></div></div>
      </section>
      <aside class="card side"><span class="tag" id="cardTag">总览</span><h3 id="cardTitle">双循环系统</h3><p id="cardText">肺循环和体循环同时进行，在心脏处相互连接，组成连续闭合的循环系统。</p><div class="route" id="route">蓝色粒子：全身 → 右心 → 肺部<br>红色粒子：肺部 → 左心 → 全身</div><div class="quiz"><h4>互动挑战</h4><p>下面哪句话正确？</p><div class="answers"><button class="answer" data-answer="a">A. 所有动脉都运输含氧较多的血液</button><button class="answer" data-answer="b">B. 肺动脉把含氧较少的血液送到肺部</button></div><div class="feedback" id="feedback"></div></div><p class="footnote">教师可先关闭标签，请学生根据粒子方向完成口述，再揭示答案。</p></aside>
    </section>
  </main>
  <script>
    const data={all:{title:'血液循环总览',sub:'点击结构查看知识卡；按播放键追踪血液回到心脏的路径。',status:'双循环同步',tag:'总览',card:'双循环系统',text:'肺循环和体循环同时进行，在心脏处相互连接，组成连续闭合的循环系统。',route:'蓝色粒子：全身 → 右心 → 肺部<br>红色粒子：肺部 → 左心 → 全身'},pulmonary:{title:'肺循环',sub:'右心室把含氧较少的血液送往肺部；完成气体交换后回到左心房。',status:'观察肺部气体交换',tag:'肺循环',card:'从右心到左心',text:'肺循环从右心室开始，经肺动脉到达肺部毛细血管；交换气体后，经肺静脉回到左心房。',route:'右心室 → 肺动脉 → 肺部毛细血管 → 肺静脉 → 左心房'},systemic:{title:'体循环',sub:'左心室将含氧较多的血液泵向全身，随后血液经腔静脉回到右心房。',status:'观察全身运输',tag:'体循环',card:'从左心到右心',text:'体循环从左心室开始，经主动脉到达全身毛细血管；交换物质后，经上、下腔静脉回到右心房。',route:'左心室 → 主动脉 → 全身毛细血管 → 上、下腔静脉 → 右心房'}};
    const info={heart:['心脏','四个心腔像两台相连的泵。右侧心腔接收来自全身、含氧较少的血液；左侧心腔把来自肺部、含氧较多的血液泵向全身。','右心 → 肺循环；左心 → 体循环','结构'],lungs:['肺部','肺泡周围分布着丰富的毛细血管。血液在这里进行气体交换：吸收氧，排出二氧化碳。','右心室 → 肺动脉 → 肺部 → 肺静脉 → 左心房','肺循环'],body:['全身毛细血管','血液在全身毛细血管处把氧和养料送给组织细胞，并带走部分二氧化碳等代谢废物。','左心室 → 主动脉 → 全身 → 上、下腔静脉 → 右心房','体循环'],pulmonaryArtery:['肺动脉','它把右心室泵出的含氧较少的血液送到肺部。名字叫“动脉”，因为血液离开心脏；不是因为血液一定富氧。','右心室 → 肺动脉 → 肺部','易错点'],pulmonaryVein:['肺静脉','它把肺部气体交换后的含氧较多血液送回左心房。名字叫“静脉”，因为血液流向心脏。','肺部 → 肺静脉 → 左心房','易错点'],aorta:['主动脉','主动脉把左心室泵出的含氧较多血液送往全身，是体循环的起点。','左心室 → 主动脉 → 全身','体循环'],venaCava:['上、下腔静脉','来自全身的含氧较少血液经上、下腔静脉回流到右心房。','全身 → 上、下腔静脉 → 右心房','体循环']};
    let mode='all',running=true,speed=1,progress=0,last=0;const paths=['pBlue','pRed','pSystemicRed','pSystemicBlue'].map(id=>document.getElementById(id));const particles=document.getElementById('particles');const dotDefs=[['pBlue','#59b8ff',.02],['pBlue','#59b8ff',.52],['pRed','#ff6677',.25],['pRed','#ff6677',.78],['pSystemicRed','#ff6677',.10],['pSystemicRed','#ff6677',.62],['pSystemicBlue','#59b8ff',.35],['pSystemicBlue','#59b8ff',.86]];
    const dots=dotDefs.map(([id,color,offset])=>{let c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('r','5');c.setAttribute('fill',color);c.setAttribute('filter','url(#glow)');particles.appendChild(c);return{c,path:document.getElementById(id),offset,id}});
    function draw(t){dots.forEach(d=>{let active=mode==='all'||(mode==='pulmonary'&&['pBlue','pRed'].includes(d.id))||(mode==='systemic'&&d.id.includes('Systemic'));d.c.style.display=active?'':'none';let p=d.path.getPointAtLength(((t+d.offset)%1)*d.path.getTotalLength());d.c.setAttribute('cx',p.x);d.c.setAttribute('cy',p.y)})}
    function animate(ts){if(!last)last=ts;if(running)progress=(progress+(ts-last)/12000*speed)%1;last=ts;draw(progress);requestAnimationFrame(animate)}requestAnimationFrame(animate);
    function setMode(next){mode=next;let d=data[next];document.querySelectorAll('.mode').forEach(b=>b.classList.toggle('active',b.dataset.mode===next));document.getElementById('title').textContent=d.title;document.getElementById('subtitle').textContent=d.sub;document.getElementById('status').textContent=d.status;document.getElementById('cardTag').textContent=d.tag;document.getElementById('cardTitle').textContent=d.card;document.getElementById('cardText').textContent=d.text;document.getElementById('route').innerHTML=d.route;document.getElementById('pBlue').classList.toggle('inactive',next==='systemic');document.getElementById('pRed').classList.toggle('inactive',next==='systemic');document.getElementById('pSystemicRed').classList.toggle('inactive',next==='pulmonary');document.getElementById('pSystemicBlue').classList.toggle('inactive',next==='pulmonary')}
    document.querySelectorAll('.mode').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));document.querySelectorAll('.steps button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.steps button').forEach(x=>x.classList.remove('active'));b.classList.add('active');if(['all','pulmonary','systemic'].includes(b.dataset.step))setMode(b.dataset.step);else if(b.dataset.step==='heart')showInfo('heart');else document.querySelector('.quiz').scrollIntoView({behavior:'smooth',block:'center'})});
    function showInfo(key){let [title,text,route,tag]=info[key];document.getElementById('cardTag').textContent=tag;document.getElementById('cardTitle').textContent=title;document.getElementById('cardText').textContent=text;document.getElementById('route').textContent=route}document.querySelectorAll('[data-info]').forEach(n=>{n.onclick=()=>showInfo(n.dataset.info);n.onkeydown=e=>{if(e.key==='Enter'||e.key===' ')showInfo(n.dataset.info)}});
    document.getElementById('play').onclick=e=>{running=!running;e.currentTarget.textContent=running?'❚❚ 暂停流动':'▶ 继续流动';e.currentTarget.setAttribute('aria-pressed',running)};document.getElementById('reset').onclick=()=>{progress=0;draw(0)};document.getElementById('speed').onchange=e=>speed=Number(e.target.value);document.getElementById('labels').onclick=e=>{let on=e.currentTarget.getAttribute('aria-pressed')==='true';document.querySelector('.labels').style.display=on?'none':'';e.currentTarget.textContent=on?'◉ 标签：关':'◉ 标签：开';e.currentTarget.setAttribute('aria-pressed',!on)};
    document.querySelectorAll('.answer').forEach(b=>b.onclick=()=>{let good=b.dataset.answer==='b',f=document.getElementById('feedback');f.className='feedback show '+(good?'good':'bad');f.textContent=good?'回答正确。肺动脉运输含氧较少的血液，因为它从右心室流向肺部。':'再想一想：动脉和静脉按血液相对心脏的流向命名，肺动脉是例外，它运输含氧较少的血液。'});
  </script>
</body>
</html>
